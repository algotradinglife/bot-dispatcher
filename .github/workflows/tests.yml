name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q

  # PI-GATE 单元测试: gate 逻辑本身正确 (不查真实 GitHub).
  pi-gates-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest tests/test_pi_gates.py -q

  # PI-GATE live check (P0): 对当前 PR 跑真实 gate — 绑定 PR HEAD 与
  # closing issue, --exit-on-block 让 FAIL 阻断 merge.
  # 需要 GH_TOKEN (repo/project read) — 仓库级 secret 或默认 GITHUB_TOKEN
  # (GITHUB_TOKEN 可读 issue/PR/project 元数据).
  pi-gates-live:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run live PI-GATE
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PAT || github.token }}
        run: |
          # 解析 PR 关联的 closing issue
          ISSUE=$(
            gh pr view "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[0].number // empty'
          )
          echo "closing issue: ${ISSUE:-none}"
          if [ -z "$ISSUE" ]; then
            echo "::warning::No closing issue linked — G02/G05 will FAIL"
            exit 0  # 无 issue 时不阻断 (PR 可能是文档/CI-only)
          fi
          python3 pi_gates.py \
            --repo "${{ github.repository }}" \
            --issue "$ISSUE" \
            --pr "${{ github.event.pull_request.number }}" \
            --operation merge \
            --exit-on-block
